<script>
(function() {
  var container = document.querySelector('.ml-embedded[data-form="xQxqUL"]');
  if (!container) return;
  var observer = new MutationObserver(function() {
    var h4  = container.querySelector('.ml-form-embedContent h4');
    var p   = container.querySelector('.ml-form-embedContent p');
    var btn = container.querySelector('.ml-form-embedSubmit button.primary');

      if (p) p.textContent = 'Mental Magic — Unchain Your Mind!';
      btn.textContent = 'Join';
      observer.disconnect();
    }
  });
  observer.observe(container, { childList: true, subtree: true });
})();
